AWSTemplateFormatVersion: '2010-09-09'
Description: Peach Lab 6 - authenticated read-only agenda parser outside the VPC.
Metadata:
  com.aws.cloudformation.Context:
    purpose: AI suggestions only. The existing API owns all database writes.
    security: Cognito verification in handler; no database, VPC, secrets or storage access.
Parameters:
  ProjectName:
    Type: String
    Default: peach
    AllowedPattern: '[a-z][a-z0-9-]{1,30}'
  ImageUri:
    Type: String
    Description: Immutable ECR digest of the backend lambda target.
    AllowedPattern: '.+@sha256:[a-f0-9]{64}'
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  SiteOrigin:
    Type: String
    AllowedPattern: 'https://[^/]+'
  ParserModel:
    Type: String
    Default: amazon.nova-pro-v1:0
  InputPrice:
    Type: Number
    Default: 0.8
    MinValue: 0
  OutputPrice:
    Type: Number
    Default: 3.2
    MinValue: 0
  BudgetEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '[^@ ]+@[^@ ]+\.[^@ ]+'
Resources:
  ParserLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-agenda-parser'
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ParseAndLogOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ParserModel}'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ParserLogs.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
  Parser:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-agenda-parser'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [app.ai.agenda_lambda.handler]
      Architectures: [arm64]
      Role: !GetAtt ParserRole.Arn
      Timeout: 30
      MemorySize: 512
      # This project has only 10 slots; AWS requires all 10 remain unreserved.
      Environment:
        Variables:
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          PARSER_MODEL: !Ref ParserModel
          PARSER_INPUT_USD_PER_MILLION: !Ref InputPrice
          PARSER_OUTPUT_USD_PER_MILLION: !Ref OutputPrice
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Parser
      AuthType: NONE
      Cors:
        AllowOrigins: [!Ref SiteOrigin]
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300
  UrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  InvokeViaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Parser
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ProjectName}-lab6-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 5
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
Outputs:
  ParserUrl:
    Description: POST with a Cognito ID token; returns suggestions only.
    Value: !GetAtt ParserUrl.FunctionUrl
  ParserName:
    Description: Function name for verification and log retrieval.
    Value: !Ref Parser
  LogGroup:
    Description: Structured token, latency and estimated cost logs.
    Value: !Ref ParserLogs
