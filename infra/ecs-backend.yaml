AWSTemplateFormatVersion: "2010-09-09"
Description: Peach lab backend - HTTPS CloudFront endpoint forwards to an ALB and ECS Fargate without a purchased domain.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  ProjectName:
    Type: String
    Default: peach
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in at least two AZs, with a route to an Internet Gateway.
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DatabaseUrlSecretArn:
    Type: String
    Description: Existing Secrets Manager secret containing the SQLAlchemy database URL.
  ImageUri:
    Type: String
  CloudFrontPrefixListId:
    Type: String
    Description: Regional AWS-managed CloudFront origin-facing prefix list.
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  CorsOrigins:
    Type: String
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
  ReleaseTaskDefinition:
    Type: String
    Default: ""
    Description: Task definition promoted after its migration task succeeds.
Conditions:
  HasRelease: !Not [!Equals [!Ref ReleaseTaskDefinition, ""]]
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-ecs"
      Tags: [{Key: PROJECT_NAME, Value: !Ref ProjectName}]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-backend"
      RetentionInDays: 7
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only CloudFront origin servers can reach the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # HTTP origin is the explicit no-domain lab tradeoff; viewer traffic is HTTPS.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only the ALB can reach API containers
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref TaskSecurityGroup
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseUrlSecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Family: !Sub "${ProjectName}-backend"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          # Migrations run once in a separate task before promotion, not on every replica.
          Command: [uvicorn, "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          Environment:
            - {Name: COGNITO_REGION, Value: !Ref AWS::Region}
            - {Name: COGNITO_USER_POOL_ID, Value: !Ref CognitoUserPoolId}
            - {Name: COGNITO_CLIENT_ID, Value: !Ref CognitoClientId}
            - {Name: APP_ENV, Value: production}
            - {Name: CORS_ORIGINS, Value: !Ref CorsOrigins}
            - {Name: DB_POOLING, Value: "false"}
          Secrets:
            - {Name: DATABASE_URL, ValueFrom: !Ref DatabaseUrlSecretArn}
          HealthCheck:
            Command: [CMD-SHELL, "curl -fsS http://localhost:8000/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      Tags: [{Key: PROJECT_NAME, Value: !Ref ProjectName}]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      # Liveness avoids restarting all containers during a shared DB outage.
      # The deployment separately verifies /api/v1/health/ready (SELECT 1).
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} API HTTPS endpoint"
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: api
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          # Never cache API responses; forward headers, cookies and query strings.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, DatabaseIngress]
    Properties:
      ServiceName: !Sub "${ProjectName}-backend"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !If [HasRelease, !Ref ReleaseTaskDefinition, !Ref TaskDefinition]
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Lab tradeoff: public egress avoids a NAT gateway. Ingress stays ALB-only.
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - {ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref TargetGroup}
Outputs:
  ApiUrl:
    Value: !Sub "https://${ApiDistribution.DomainName}"
  ApiDistributionId:
    Value: !Ref ApiDistribution
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
