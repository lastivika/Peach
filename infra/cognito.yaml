AWSTemplateFormatVersion: '2010-09-09'
Description: Peach email sign-in with Cognito hosted login and authorization code PKCE.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  ProjectName:
    Type: String
    Default: peach
  SiteUrl:
    Type: String
  DomainPrefix:
    Type: String
    Description: Globally unique Cognito domain prefix.
  GoogleClientId:
    Type: String
    Description: Google OAuth Web application client ID.
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth Web application client secret. Never commit this value.
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        email_verified: email_verified
  Client:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${ProjectName}-web'
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO, Google]
      CallbackURLs:
        - !Sub '${SiteUrl}/auth/callback/'
        - 'http://localhost:3000/auth/callback/'
        - !Sub '${SiteUrl}/callback'
        - 'http://localhost:3000/callback'
      LogoutURLs: [!Sub '${SiteUrl}/', 'http://localhost:3000/']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits: {IdToken: hours, AccessToken: hours, RefreshToken: days}
      RefreshTokenRotation: {Feature: ENABLED, RetryGracePeriodSeconds: 10}
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH]
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2
  Branding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref Client
      UseCognitoProvidedValues: true
Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref Client
  Domain:
    Value: !Sub '${Domain}.auth.${AWS::Region}.amazoncognito.com'
  GoogleAuthorizedJavascriptOrigin:
    Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  GoogleAuthorizedRedirectUri:
    Value: !Sub 'https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse'
