name: CI and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases; never interrupt a migration or infrastructure update.
concurrency:
  group: peach-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/lint.yml

  backend:
    name: Deploy ECS backend
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.deploy.outputs.backend_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Deploy the tested commit
        id: deploy
        run: make deploy-backend
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || 'peach' }}
          IMAGE_TAG: ${{ github.sha }}
          API_CORS_ORIGINS: ${{ vars.API_CORS_ORIGINS }}
          AWS_SUBNET_IDS: ${{ vars.AWS_SUBNET_IDS }}
          AWS_VPC_ID: ${{ vars.AWS_VPC_ID }}
          DATABASE_STACK_NAME: ${{ vars.DATABASE_STACK_NAME }}
          DATABASE_URL_SECRET_ARN: ${{ vars.DATABASE_URL_SECRET_ARN }}
          DATABASE_SECURITY_GROUP_ID: ${{ vars.DATABASE_SECURITY_GROUP_ID }}

  frontend:
    name: Deploy CloudFront frontend
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Publish the frontend against the deployed API
        run: make deploy-frontend
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || 'peach' }}
          BACKEND_URL: ${{ needs.backend.outputs.backend_url }}
